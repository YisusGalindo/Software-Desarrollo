{% extends "base.html" %}
{% block content %}
  <h2>Receta para {{ paciente.nombre }}</h2>
  <form method="POST" class="mt-3">
    <div class="mb-3">
      <label class="form-label">Síntomas</label>
      <textarea name="sintomas" class="form-control" required></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Diagnóstico</label>
      <textarea name="diagnostico" class="form-control" required></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label">Medicamentos (busca y selecciona)</label>
      <select id="medicamentos" name="medicamentos" class="form-control" multiple required>
        {% for med in medicamentos %}
          <option value="{{ med.nombre }}">{{ med.nombre }}</option>
        {% endfor %}
      </select>
      <small class="text-muted">Puedes seleccionar varios medicamentos.</small>
    </div>
    <button type="submit" class="btn btn-success">Guardar Receta</button>
    <a href="/pacientes" class="btn btn-outline-secondary">Cancelar</a>
  </form>
{% endblock %}
