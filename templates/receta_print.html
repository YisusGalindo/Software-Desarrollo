<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receta | {{ paciente.nombre }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #fff; }
    .receta { max-width: 800px; margin: 40px auto; padding: 32px; border: 1px solid #ddd; }
    .cabecera { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .clinica { font-weight: 700; font-size: 1.25rem; }
    .datos { font-size: .95rem; }
    .titulo { text-align: center; font-size: 1.2rem; font-weight: 700; margin: 16px 0; }
    .firma { margin-top: 60px; text-align: right; }
    @media print { .print-hidden { display: none !important; } }
  </style>
</head>
<body>
  <div class="receta">
    <div class="cabecera">
      <div class="clinica">Consultorio Pediátrico</div>
      <div class="datos">Fecha: __________</div>
    </div>
    <div class="datos">
      <p><strong>Paciente:</strong> {{ paciente.nombre }}</p>
    </div>
    <div class="titulo">Receta Médica</div>
    <div>
      <p><strong>Diagnóstico:</strong> {{ receta.diagnostico }}</p>
      <p><strong>Indicaciones:</strong></p>
      <ul>
        {% for m in receta.receta %}
          <li>{{ m }}</li>
        {% endfor %}
      </ul>
    </div>
    <div class="firma">
      <p>_____________________________</p>
      <p>Médico Pediatra</p>
      <p>Cédula Profesional: _________</p>
    </div>
  </div>
  <div class="text-center print-hidden">
    <a href="javascript:window.print()" class="btn btn-primary mt-3">Imprimir</a>
  </div>
</body>
</html>
