{% extends "base.html" %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Medicamentos</h2>
  </div>

  <form method="POST" action="/medicamentos/nuevo" class="row g-3 mb-4">
    <div class="col-md-6">
      <input type="text" name="nombre" placeholder="Nombre del medicamento" required class="form-control">
    </div>
    <div class="col-md-3 d-flex align-items-center">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="chkPediatrico" name="es_pediatrico" checked>
        <label class="form-check-label" for="chkPediatrico">Pediátrico</label>
      </div>
    </div>
    <div class="col-md-3">
      <button type="submit" class="btn btn-success">Agregar Medicamento</button>
    </div>
  </form>

  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead>
        <tr><th>Nombre</th><th>Pediátrico</th><th>Acciones</th></tr>
      </thead>
      <tbody>
        {% for m in medicamentos %}
          <tr>
            <td>{{ m.nombre }}</td>
            <td>{% if m.es_pediatrico %}<span class="badge text-bg-success">Sí</span>{% else %}<span class="badge text-bg-secondary">No</span>{% endif %}</td>
            <td><a href="/medicamentos/eliminar/{{ m._id }}" class="btn btn-outline-danger btn-sm">Eliminar</a></td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
